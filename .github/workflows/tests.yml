name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt python-docx openpyxl python-pptx
        working-directory: bot
      - run: python core/tests/test_converter.py
      - run: python bot/tests/test_documents.py
      - run: python desktop/tests/test_typist.py
