# Signed release builds: Harfix.apk for the website (direct flavor) and the AAB for Google Play
# (play flavor). Run it by hand: Actions → android-release → Run workflow.
# Needs two repository secrets (android/README.md, "Imzolash"):
#   ANDROID_KEYSTORE_BASE64    the release keystore (alias "harfix"), base64
#   ANDROID_KEYSTORE_PASSWORD  its password
# The key is written to the runner only for the build and deleted afterwards.
name: android-release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Add the secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (android/README.md, Imzolash)"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/harfix-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/harfix-release.jks"
            echo "storePassword=$PASSWORD"
            echo "keyAlias=harfix"
            echo "keyPassword=$PASSWORD"
          } > keystore.properties

      - name: Tests, website APK and Google Play bundle
        run: ./gradlew --no-daemon testDirectReleaseUnitTest testPlayReleaseUnitTest assembleDirectRelease bundlePlayRelease

      - name: Signature, 16 KB pages and permissions
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk=app/build/outputs/apk/direct/release/app-direct-release.apk
          "$BT/apksigner" verify --verbose --print-certs "$apk" | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)"
          "$BT/zipalign" -c -P 16 -v 4 "$apk" > zipalign.txt || { grep -v "(OK" zipalign.txt | tail -20; exit 1; }
          "$BT/aapt2" dump badging "$apk" | grep -E "^package:|uses-permission"

      - name: Google Play bundle stays plain (no photos permission, ads or accessibility service)
        run: |
          # the bundle's manifest is protobuf, but its strings are plain text
          found=$(unzip -p app/build/outputs/bundle/playRelease/app-play-release.aab base/manifest/AndroidManifest.xml |
            grep -a -o -E "READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE|permission\.AD_ID|BIND_ACCESSIBILITY_SERVICE|com\.yandex" | sort -u || true)
          if [ -n "$found" ]; then
            echo "::error::The Play bundle must not have: $found (android/PLAY.md, section 0)"
            exit 1
          fi
          echo "Play bundle manifest: OK"

      - name: Name the files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/direct/release/app-direct-release.apk dist/Harfix.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab dist/Harfix-play.aab
          cp app/build/outputs/mapping/directRelease/mapping.txt dist/mapping-direct.txt 2>/dev/null || true
          cp app/build/outputs/mapping/playRelease/mapping.txt dist/mapping-play.txt 2>/dev/null || true
          (cd dist && sha256sum Harfix.apk Harfix-play.aab > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Remove the key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/harfix-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Harfix-android-release
          path: android/dist/
