# Builds and tests the Android app (both flavors) and checks what Google Play checks on upload.
# The test APKs ("Harfix (test)", uz.harfix.app.debug, installs next to the real app) and the
# keyboard screenshots are under the run's Artifacts.
name: android
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and test APKs (direct = website, play = Google Play)
        run: ./gradlew --no-daemon testDirectDebugUnitTest testPlayDebugUnitTest assembleDirectDebug assemblePlayDebug

      - name: Native libraries are 16 KB page aligned (Google Play requirement)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          fail=0
          for apk in app/build/outputs/apk/*/debug/*.apk; do
            echo "== $apk"
            "$BT/zipalign" -c -P 16 -v 4 "$apk" > zipalign.txt || { grep -v "(OK" zipalign.txt | tail -20; fail=1; }
            rm -rf so && mkdir so && unzip -q -o "$apk" 'lib/arm64-v8a/*.so' 'lib/x86_64/*.so' -d so 2>/dev/null || true
            for so in $(find so -name '*.so'); do
              # every LOAD segment must be aligned to at least 0x4000 (16 KB)
              aligns=$(readelf -lW "$so" | awk '$1=="LOAD" {print $NF}' | sort -u | tr '\n' ' ')
              small=$(for a in $aligns; do [ $((a)) -lt 16384 ] && echo "$a"; done)
              if [ -n "$small" ]; then echo "NOT 16 KB: $so ($aligns)"; fail=1; else echo "ok $so ($aligns)"; fi
            done
          done
          exit $fail

      - name: Permissions and services Google Play will see
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in app/build/outputs/apk/*/debug/*.apk; do
            echo "== $apk"
            "$BT/aapt2" dump permissions "$apk"
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -E "android:name.*(Service|Tile|Provider)\b|accessibility" || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Harfix-android-test
          path: |
            android/app/build/outputs/apk/*/debug/*.apk
            android/app/build/keyboard-shots/
            android/app/build/reports/tests/
          if-no-files-found: ignore
