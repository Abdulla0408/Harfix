    <!-- Keyboard -->
    <section id="tab-keyboard" class="panel">
      <div class="card">
        <h2 data-t="Odatiy klaviaturangizda"></h2>
        <p class="hint"><span data-t="Gboard yoki boshqa klaviaturada yozaverasiz: yozishingiz bilan"></span>
          <b>oʻ gʻ sh ch</b> → <b>ö ğ ş ç</b>. <span data-t="Masalan:"></span> <b>Tosh</b> → <b>Toş</b>.
          <span data-t="Kerak boʻlmasa — darhol ⌫ bosing, harflar qaytadi."></span></p>
        <div class="step" id="step-words">
          <span class="num">✓</span>
          <div class="grow"><b data-t="Maxsus imkoniyatlarda yoqing"></b>
            <div class="hint" data-t="Sozlamalar → Maxsus imkoniyatlar → «Harfix: odatiy klaviaturada». Android ogohlantirish koʻrsatadi — bu odatiy holat."></div></div>
          <button class="btn small" id="words-on" data-t="Yoqish"></button>
        </div>
        <label class="set"><div><b data-t="Yozayotganda oʻgirish"></b></div>
          <span class="switch"><input type="checkbox" data-set="words"><span></span></span></label>
        <label class="set"><div><b data-t="Darhol"></b>
          <p class="hint" data-t="Oʻchirilsa, soʻz tugaganda (boʻsh joy yoki tinish belgisidan keyin) oʻgiriladi."></p></div>
          <span class="switch"><input type="checkbox" data-set="words_live"><span></span></span></label>
        <p class="hint" data-t="Tez yoqib-oʻchirish: bildirishnomalar pardasini tushiring → ✏️ (tahrirlash) → «Harfix» tugmasini qoʻshing."></p>
        <p class="hint" data-t="Harfix roʻyxatda kulrang boʻlsa: Ilova haqida → ⋮ → «Cheklangan sozlamalarga ruxsat berish», keyin qayta urinib koʻring."></p>
        <button class="link" id="app-settings" data-t="Ilova haqida sahifasini ochish"></button>
      </div>

      <div class="card">
        <h2 data-t="Harfix klaviaturasi"></h2>
        <p class="hint"><span data-t="Istalgan ilovada"></span> <b>oʻ gʻ sh ch</b> <span data-t="yozsangiz, darhol"></span>
          <b>ö ğ ş ç</b> <span data-t="ga almashadi. Kerak boʻlmasa — darhol Backspace."></span></p>
        <div class="step" id="step1">
          <span class="num">1</span>
          <div class="grow"><b data-t="Klaviaturani yoqing"></b><div class="hint" data-t="Sozlamalarda «Harfix klaviaturasi»ni yoqing."></div></div>
          <button class="btn small" id="enable" data-t="Yoqish"></button>
        </div>
        <div class="step" id="step2">
          <span class="num">2</span>
          <div class="grow"><b data-t="Harfixʼni tanlang"></b><div class="hint" data-t="Klaviaturalar roʻyxatidan Harfixʼni tanlang."></div></div>
          <button class="btn small" id="choose" data-t="Tanlash"></button>
        </div>
        <div class="step" id="step3">
          <span class="num">3</span>
          <div class="grow"><b data-t="Sinab koʻring"></b>
            <textarea id="try" rows="2" spellcheck="false"></textarea></div>
        </div>
      </div>
      <div class="card settings">
        <label class="set"><div><b data-t="Yozayotganda oʻgirish"></b>
          <p class="hint" data-t="Parol, e-mail va sayt manzili maydonlarida ishlamaydi."></p></div>
          <span class="switch"><input type="checkbox" data-set="live"><span></span></span></label>
        <label class="set"><div><b data-t="Takliflar va avto-tuzatish"></b>
          <p class="hint" data-t="Tepada 3 ta soʻz chiqadi. Harfix ishonchi komil boʻlsa, xato soʻz boʻsh joy bosilganda tuzatiladi. Darhol ⌫ — qaytadi. Lugʻat: Vikipediya matnlari asosida (CC BY-SA 4.0)."></p></div>
          <span class="switch"><input type="checkbox" data-set="autocorrect"><span></span></span></label>
        <label class="set"><div><b data-t="Chizib yozish"></b>
          <p class="hint" data-t="Barmoqni harflar ustidan uzmasdan yurgizing — soʻz oʻzi yoziladi. s, o, g, c ustidan oʻtsangiz ş, ö, ğ, ç li soʻzlar ham chiqadi."></p></div>
          <span class="switch"><input type="checkbox" data-set="glide"><span></span></span></label>
        <label class="set"><div><b data-t="Soʻzlarni oʻrganish"></b>
          <p class="hint" data-t="Lugʻatda yoʻq soʻzlaringizni faqat shu telefonda eslab qoladi, hech qayerga yuborilmaydi. Oʻchirilsa, oʻrganilgan soʻzlar ham oʻchadi."></p></div>
          <span class="switch"><input type="checkbox" data-set="learn"><span></span></span></label>
        <label class="set"><div><b data-t="Tebranish"></b></div>
          <span class="switch"><input type="checkbox" data-set="vibrate"><span></span></span></label>
        <label class="set"><div><b data-t="Tovush"></b></div>
          <span class="switch"><input type="checkbox" data-set="sound"><span></span></span></label>
        <label class="set"><div><b>Русский</b><p class="hint" data-t="Rus tilidagi klaviatura"></p></div>
          <span class="switch"><input type="checkbox" data-set="lang_ru"><span></span></span></label>
        <label class="set"><div><b>Ўзбекча (кирилл)</b><p class="hint" data-t="Oʻzbek kirill klaviaturasi"></p></div>
          <span class="switch"><input type="checkbox" data-set="lang_uz_cyrl"><span></span></span></label>
        <label class="set"><div><b data-t="Skrinshotlar buferda"></b>
          <p class="hint" data-t="Skrinshot olishingiz bilan u klaviatura buferida turadi: bir bosishda yoki «Qoʻyish» bilan yuborasiz. Rasmlarni koʻrish ruxsati soʻraladi; rasmlar telefondan chiqmaydi."></p></div>
          <span class="switch"><input type="checkbox" data-set="shots"><span></span></span></label>
        <div class="set"><div><b data-t="Klaviatura foni"></b>
          <p class="hint" data-t="Telefoningizdagi rasm klaviatura orqasida turadi. Boshqa mavzular: klaviatura menyusi → Mavzu (Lojuvard, Shafaq, Tun)."></p></div>
          <div class="bg-buttons"><button class="btn small" id="bg-pick" data-t="Rasm tanlash"></button>
            <button class="btn small" id="bg-clear" data-t="Olib tashlash" hidden></button></div></div>
      </div>
      <div class="card" id="dict-card">
        <h3 data-t="Shaxsiy lugʻat"></h3>
        <p class="hint" data-t="Lugʻatda yoʻq soʻzlaringiz: klaviatura ularni tuzatmaydi va taklif qiladi. Yozayotganda tepada chiqadigan «＋ soʻz» ni bosib ham qoʻshasiz."></p>
        <form id="dict-form" class="dict-form"><input id="dict-input" type="text" autocomplete="off" spellcheck="false" maxlength="30">
          <button class="btn small primary" data-t="Qoʻshish"></button></form>
        <div id="dict-list" class="chips"></div>
      </div>
      <div class="card">
        <h3 data-t="Qulayliklar"></h3>
        <ul class="rules" id="kbd-tips"></ul>
      </div>
      <div class="card settings">
        <h3 data-t="🔒 Maxfiylik"></h3>
        <p class="hint" data-t="Yozganlaringiz va fayllaringiz hech qayerga yuborilmaydi va saqlanmaydi — hammasi telefonning oʻzida bajariladi. Faqat «Soʻzlarni oʻrganish» yoqilgan boʻlsa, klaviatura lugʻatda yoʻq soʻzlarni shu telefonda eslab qoladi. Internet boʻlsa, ilova yangiliklarni tekshiradi. Reklama koʻrsatilganda Yandex reklama xizmati qurilma haqidagi maʼlumotlarni (reklama identifikatori, IP manzil, qurilma modeli) oladi."></p>
        <label class="set"><div><b data-t="Anonim statistika"></b>
          <p class="hint" data-t="Kuniga bir marta faqat «Harfix ishlatildi» belgisi yuboriladi: tasodifiy raqam va versiya. Ism, telefon raqami, matn yuborilmaydi."></p></div>
          <span class="switch"><input type="checkbox" data-set="stats"><span></span></span></label>
        <label class="set"><div><b data-t="Bildirishnomalar"></b>
          <p class="hint" data-t="Eʼlonlar, yangi versiya va «Odatiy klaviaturada» oʻchib qolsa. Reklama yuborilmaydi."></p></div>
          <span class="switch"><input type="checkbox" data-set="notify"><span></span></span></label>
        <p><button class="btn" id="feedback" data-t="💬 Taklif va shikoyatlar"></button></p>
        <p class="hint" data-t="Telegram orqali yozing: @a33208"></p>
        <p><button class="link" id="privacy" data-t="Maxfiylik siyosati"></button></p>
        <p class="hint" id="app-version"></p>
      </div>
    </section>

    <!-- Learn -->
    <section id="tab-learn" class="panel">
      <p class="lead" data-t="Qonun bilan lotin alifbosidagi 4 ta harf oʻzgardi. Qolgan harflar avvalgidek qoladi."></p>
      <div class="letters" id="letters"></div>
      <div class="card">
        <h3 data-t="Qoidalar"></h3>
        <ul class="rules" id="rules"></ul>
      </div>
    </section>

    <!-- Quiz -->
    <section id="tab-quiz" class="panel">
      <div class="card quiz">
        <div class="row">
          <span id="qnum" class="hint"></span>
          <span id="qscore" class="badge"></span>
        </div>
        <div class="progress"><div id="qbar"></div></div>
        <h2 id="qtext"></h2>
        <div id="qopts" class="opts"></div>
        <p id="qexpl" class="hint"></p>
        <button id="qnext" class="btn primary wide" data-t="Keyingi savol" hidden></button>
      </div>
    </section>

  <!-- Shown before Accessibility settings: what the word service does (Google Play asks for this) -->
  <!-- APK from the website / Telegram (not Google Play): Android first blocks Accessibility ("Restricted setting") -->
  <div class="modal" id="words-guide" hidden role="dialog" aria-modal="true" aria-labelledby="guide-title">
    <div class="sheet">
      <h2 id="guide-title" data-t="Yoqish: 3 qadam"></h2>
      <p class="hint" data-t="Harfix Play Marketdan oʻrnatilmagani uchun Android avval ruxsat soʻraydi. Bu bir marta qilinadi."></p>
      <div class="step"><span class="num">1</span>
        <div class="grow" data-t="«Yoqish» → «Downloaded apps» (Yuklab olingan ilovalar) → «Harfix: odatiy klaviaturada». «Restricted setting» chiqadi — OK ni bosib, shu yerga qayting."></div>
        <button class="btn small" id="guide-try" data-t="Yoqish"></button></div>
      <div class="step"><span class="num">2</span>
        <div class="grow" data-t="«Ochish» → oʻng yuqoridagi ⋮ → «Allow restricted settings» (Cheklangan sozlamalarga ruxsat berish) → telefon parolingiz."></div>
        <button class="btn small" id="guide-app" data-t="Ochish"></button></div>
      <div class="step"><span class="num">3</span>
        <div class="grow" data-t="«Yoqish» — endi toʻgʻridan-toʻgʻri Harfix tugmasi ochiladi: yoqing va OK ni bosing."></div>
        <button class="btn small primary" id="guide-on" data-t="Yoqish"></button></div>
      <div class="sheet-actions">
        <button class="btn" id="guide-close" data-t="Yopish"></button>
      </div>
    </div>
  </div>

  <div class="modal" id="words-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="words-title">
    <div class="sheet">
      <h2 id="words-title" data-t="«Odatiy klaviaturada» xizmati"></h2>
      <p data-t="Bu xizmat Androidʼning Maxsus imkoniyatlari orqali ishlaydi va siz yozayotgan matn maydonini koʻradi:"></p>
      <ul class="rules">
        <li data-t="Siz yozgan oʻ, gʻ, sh, ch harflarini darhol ö, ğ, ş, ç ga almashtiradi (⌫ bilan qaytariladi)."></li>
        <li data-t="Faqat siz yozayotgan maydon koʻriladi. Parol, e-mail, sayt manzili maydonlari, havolalar va kirill matn tegilmaydi."></li>
        <li data-t="Matn hech qayerga yuborilmaydi va saqlanmaydi — hammasi telefonning oʻzida."></li>
      </ul>
      <p class="hint" data-t="Keyingi oynada «Harfix: odatiy klaviaturada» ni toping va yoqing."></p>
      <div class="sheet-actions">
        <button class="btn" id="words-cancel" data-t="Bekor qilish"></button>
        <button class="btn primary" id="words-agree" data-t="Roziman, davom etish"></button>
      </div>
    </div>
  </div>

  <!-- Until the Harfix keyboard is chosen: invite to switch it on -->
  <div class="modal" id="kbd-onboard" hidden role="dialog" aria-modal="true" aria-labelledby="onboard-title">
    <div class="sheet">
      <h2 id="onboard-title" data-t="Harfix klaviaturasini yoqing"></h2>
      <p data-t="Yangi alifboda yozishning eng oson yoʻli:"></p>
      <ul class="rules">
        <li data-t="Tepada ö ğ ş ç harflari tayyor turadi, eski yozuv esa yozilishi bilan yangisiga oʻzi almashadi."></li>
        <li data-t="Xato soʻzlarni oʻzi tuzatadi va soʻz taklif qiladi."></li>
        <li data-t="Barmoqni harflar ustidan yurgizib yozish, bufer, matnni tahrirlash."></li>
      </ul>
      <div class="step" id="ob-step1"><span class="num">1</span>
        <div class="grow"><b data-t="Yoqing"></b><div class="hint" data-t="Roʻyxatda «Harfix klaviaturasi»ni yoqing."></div></div>
        <button class="btn small primary" id="ob-enable" data-t="Yoqish"></button></div>
      <div class="step" id="ob-step2"><span class="num">2</span>
        <div class="grow"><b data-t="Tanlang"></b><div class="hint" data-t="Harfix klaviaturasini asosiy qilib tanlang."></div></div>
        <button class="btn small" id="ob-choose" data-t="Tanlash"></button></div>
      <div class="sheet-actions"><button class="btn" id="ob-later" data-t="Keyinroq"></button></div>
    </div>
  </div>
